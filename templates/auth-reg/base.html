<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/chota/chota.css' )}}">
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/style.css' )}}">
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/normalize.css' )}}">
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/registration.css' )}}">
    <title>{% block title %} {% endblock %}</title>
</head>
<body>
        <div class=" reg-form row is-horizontal-align is-vertical-center">
            <div class="__reg-form col-6 col-3-md col-4-lg text-center is-vertical-center">
                <div class="logo is-horizontal-align">
                    <div class="logo-text ">
                        <img src="{{ url_for( 'static', path='logo.svg' )}}" alt="">
                    </div>
                </div>
                <form action="" class="reg">
                     <div class="row is-horizontal-align">
                            <div class="input-row is-marginless col-12">
                                <div class="un_logo_text  col-9">{% block un_logo_text %} {% endblock %}</div>
                                <div class="reg-text-info">{% block info %} {% endblock %}</div>
                                {% block name %} {% endblock %}
                                <div class="text-left input-elem-reg col-9  ">
                                    <label for="email">Почта</label>
                                        <div class="input-container">
                                          <i class="icon"><img clas src="{{ url_for( 'static', path='icon/message.png' )}}" alt=""></i>
                                          <input type="text" id="email" name="email" placeholder="Email">
                                        </div>
                                </div>
                                <div class="text-left input-elem-reg col-9 border-radius">
                                    <label for="password">Пароль</label>
                                    <div class="input-container">
                                          <i class="icon"><img clas src="{{ url_for( 'static', path='icon/padlock.png' )}}" alt=""></i>
                                          <input type="password" id="password" name="password" required minlength="4" maxlength="8" size="10" placeholder="Пароль"/>
                                    </div>
                                </div>

                                <div class="text-left input-elem-reg col-9 border-radius">
                                    <input  type="submit" id="reg-submit" value="Зарегистрироваться" />
                                </div>
                                <div class="text-left input-elem-reg is-horizontal-align">
                                    {% block redirect %} {% endblock %}
                                </div>
                            </div>
                     </div>
                </form>

            </div>
        </div>
</body>
</html>
