<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/chota/chota.css' )}}">
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/style.css' )}}">
    <link rel="stylesheet" href="{{ url_for( 'static', path='css/normalize.css' )}}">
    {% block res %} {% endblock %}
</head>
<body>
<script>
  window.addEventListener("scroll", function() {
    var nav = document.querySelector(".nav");
    nav.classList.toggle("scroll", window.scrollY > 0);
  });
</script>
    <div class="main">
        <nav class="nav" >
              <div class="__nav">
                  <div class="nav-left">
                    <a  class="main-str brand" href="http://127.0.0.1:8000/pages/main">
                        <div class="logo">
                            <div class="logo-text is-vertical-align">
                                <img src="{{ url_for( 'static', path='logo.svg' )}}" alt="">
                            </div>
                        </div>
                    </a>
                  </div>
                  <div class="nav-right is-vertical-align">
                      <div > <a class="button outline btn">Ценовая политика</a> </div>
                      <div> <a class="button outline btn">Документ</a> </div>
                      <div class="col-5.5"> <a id="btn-f" href="{{ url_for('get_reg_page') }}" class="button btn" >Войти в аккаунт или зарегистрироваться</a> </div>
                  </div>
              </div>
        </nav>

        {% block content %}

        {% endblock %}
        <footer>
            <div class="--footer">
                <div class="elems-footer row">
                    <div class="elem-footer col-2">
                        <a  class="main-str brand" href="http://127.0.0.1:8000/pages/main">
                        <div class="logo">
                            <div class="logo-text is-vertical-align">
                                <img src="{{ url_for( 'static', path='logo.svg' )}}" alt="">
                            </div>
                        </div>
                    </a>
                    </div>
                    <div class="elem-footer-society is-vertical-align ">
                        <a href="">
                            <div class="society-block is-rounded">
                            <div class="__society-block  is-vertical-align">
                                <img clas src="{{ url_for( 'static', path='icon/instagram.png' )}}" alt="">
                            </div>
                        </div>
                        </a>
                        <div class="society-block is-rounded">
                            <a href="">
                                <div class="__society-block is-vertical-align">
                                <img clas src="{{ url_for( 'static', path='icon/youtube.png' )}}" alt="">
                            </div>
                            </a>
                        </div>
                       <div class="society-block is-rounded">
                           <a href="">
                               <div class="__society-block is-vertical-align">
                                <img clas src="{{ url_for( 'static', path='icon/telegram.png' )}}" alt="">
                            </div>
                           </a>
                        </div>
                    </div>
                </div>
                <div class="f-content-divider"></div>
                <div class="is-horizontal-align text-footer">
                    <p>Авторские права © 2010-2023 BizMetrics Company B.C. Все права защищены.</p>
                </div>
            </div>

        </footer>
    </div>
</body>
</html>
