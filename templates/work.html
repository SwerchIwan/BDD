{% extends "base.html" %}

{% block title %}BizMetrics{% endblock %}

{% block res %}
   <link rel="stylesheet" href="{{ url_for( 'static', path='css/download.css' )}}">
{% endblock %}

{% block content %}
   <div class="block-download">
      <div class="__block-download is-vertical-align is-horizontal-align">
         <div class="__block-download-with-title col-6">
            <div class="download-title is-center gradient-text text-center">
               <p>Загрузите свой файл для дальнейшей работы</p>
            </div>
            <div class="__block-download-elem ">
               <div class="icon-download is-center col-2">
                  <img src="{{ url_for( 'static', path='icon/upload.png' )}}" alt="">
               </div>
              <div class="file-input-wrapper">
                <form action="/work/upload" method="post"  enctype="multipart/form-data" onsubmit="return false;">
                   <input type="file" id="myFileInput" style="display: none;">
                     <button id="btn-f-download" onclick="document.getElementById('myFileInput').click()">Выбрать файл</button>
                     <div class="block-selected-name">
                         <p id="selectedFileName"></p>
                     </div>

                     <script>
                       document.getElementById('myFileInput').addEventListener('change', function() {
                         var file = this.files[0];
                         document.getElementById('selectedFileName').textContent = file.name;
                       });
                     </script>
               </form>
              </div>
                <div class="block-text-download">
                    <div class="__block-text-download">
                        <div class="download-text-one text-center is-marginless">
                            <p class="is-marginless">Добавьте файл таблицы формата EXCEL</p><br>
                        </div>
                        <div class="download-text-two text-center is-marginless row is-horizontal-align">
                            <div class="__download-text-two">
                                <p class="is-marginless">Поддерживаемые расширения:</p>
                            </div>
                            <div class="download-text-two-format">
                                <p class="green-form">XLS</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
         </div>
      </div>
   </div>

{% endblock %}
