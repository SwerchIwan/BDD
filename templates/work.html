{% extends "base.html" %}

{% block title %}BizMetrics{% endblock %}

{% block res %}
   <link rel="stylesheet" href="{{ url_for( 'static', path='css/download.css' )}}">
{% endblock %}

{% block content %}
   <div class="block-download">
      <div class="__block-download is-vertical-align is-horizontal-align">
         <div class="__block-download-with-title col-6">
            <div class="download-title is-center gradient-text text-center">
               <p>Загрузите свой файл для дальнейшей работы</p>
            </div>
            <div class="__block-download-elem ">
               <div class="icon-download is-center col-2">
                  <img src="{{ url_for( 'static', path='icon/upload.png' )}}" alt="">
               </div>
              <div class="file-input-wrapper">
        <form action="/pages/result_analysis" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
            <input type="file" id="myFileInput" style="display: none;" onchange="handleFileSelect(event)">
            <button id="btn-f-download" onclick="handleFileInputClick(event)">Выбрать файл</button>
            <div class="block-selected-name">
                <p id="selectedFileName"></p>
            </div>

            <script>
                function handleFileInputClick(event) {
                    event.preventDefault(); // Задерживаем отправку формы
                    document.getElementById('myFileInput').click();
                }


                function handleFileSelect(event) {
                    var fileInput = event.target;
                    var selectedFileName = fileInput.files[0].name;
                    document.getElementById('selectedFileName').textContent = selectedFileName;

                    if (selectedFileName.endsWith('.xlsx')) {
                        submitForm();
                    } else {
                        alert('Выберите файл в формате .xlsx');
                    }
                }

                function submitForm() {
                    var fileInput = document.getElementById('myFileInput');
                    var file = fileInput.files[0];

                    var form = new FormData();
                    form.append('file', file);

                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', '/work/upload', true);

                    xhr.onload = function () {
                        if (xhr.status === 200) {
                            try {
                                // Попытка разбора JSON-ответа
                                var response = JSON.parse(xhr.responseText);
                                var savedFileName = response.file_name;

                                // Переадресация на страницу, передавая имя файла в URL
                                window.location.href = '/pages/result_analysis?file=' + savedFileName;


                            } catch (error) {
                                console.error('Ошибка при разборе JSON:', error);
                            }
                        } else {
                            console.error('Ошибка при загрузке файла:', xhr.statusText);
                    }
                };

                xhr.send(form);
            }



                function validateForm() {
                    var selectedFileName = document.getElementById('selectedFileName').textContent;

                    if (selectedFileName === "") {
                        alert('Выберите файл');
                        return false;
                    }

                    return true;
                }
            </script>
        </form>


              </div>
                <div class="block-text-download">
                    <div class="__block-text-download">
                        <div class="download-text-one text-center is-marginless">
                            <p class="is-marginless">Добавьте файл таблицы формата EXCEL</p><br>
                        </div>
                        <div class="download-text-two text-center is-marginless row is-horizontal-align">
                            <div class="__download-text-two">
                                <p class="is-marginless">Поддерживаемые расширения:</p>
                            </div>
                            <div class="download-text-two-format">
                                <p class="green-form">XLSX</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
         </div>
      </div>
   </div>

{% endblock %}
